name: Build Windows app

# Every push to main builds the installer (download it from the run's artifacts).
# When app/package.json has a version that has no GitHub Release yet (or on a tag vX.Y.Z), the build also makes the
# Release (tag vX.Y.Z made by GitHub) and sends the installer to upload.talastudio.net, which signs it
# (Worker secret UPDATER_SIGNING_KEY; the public key is in app/src-tauri/tauri.conf.json) and offers it to every
# installed app as an update. Sending uses GitHub OIDC, so this repo needs no secrets at all.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: ['server/**', '.github/workflows/deploy-server.yml', '*.md']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Check versions match, decide whether this is a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json $PKG, Cargo.toml $CARGO"
          test "$PKG" = "$CARGO"
          echo "VERSION=$PKG" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "refs/tags/v$PKG" = "$GITHUB_REF"; echo "RELEASE=1" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$PKG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "New version $PKG: this build is a release."; echo "RELEASE=1" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - name: Build installer
        run: npx tauri build

      - name: Find installer
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          ls -la src-tauri/target/release/bundle/nsis/

      - uses: actions/upload-artifact@v4
        with:
          name: TalaStudio-Upload-installer
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe*
          retention-days: 30

      - name: GitHub Release
        if: env.RELEASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$EXE" --target "$GITHUB_SHA" --title "TalaStudio Upload v$VERSION" --notes "Installer Windows. Aplikasi yang sudah terpasang memperbarui diri sendiri." || \
          gh release upload "v$VERSION" "$EXE" --clobber

      - name: Publish update to upload.talastudio.net
        if: env.RELEASE == '1'
        run: |
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=upload.talastudio.net" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          NOTES=$(git log -1 --pretty=%s)
          curl -sS --fail-with-body -X POST https://upload.talastudio.net/app/publish \
            -H "Authorization: Bearer $OIDC" \
            --form-string "version=$VERSION" --form-string "notes=$NOTES" -F "installer=@$EXE"
